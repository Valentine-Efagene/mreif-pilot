name: mofi-platform-test

services:
  mysql:
    image: mysql:8.0
    container_name: mofi-test-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: mofi_test_root
      MYSQL_DATABASE: mofi_platform_test
    ports:
      - "3308:3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pmofi_test_root"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: mofi-test-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    command: redis-server --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: mofi-test-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9100:9000"
      - "9101:9001"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: mofi-test-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: mofi
      RABBITMQ_DEFAULT_PASS: mofi
      RABBITMQ_DEFAULT_VHOST: mofi
    ports:
      - "5673:5672"
      - "15673:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s

  minio-init:
    image: minio/mc:latest
    container_name: mofi-test-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_BUCKET: mofi-test
      MC_ENDPOINT: http://minio:9000
    volumes:
      - ./scripts/init-minio.sh:/init-minio.sh:ro
    entrypoint: ["/bin/sh", "/init-minio.sh"]
    restart: "no"
