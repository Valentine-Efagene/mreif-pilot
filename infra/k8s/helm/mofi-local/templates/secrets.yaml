apiVersion: v1
kind: Secret
metadata:
  name: mofi-secrets
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "mofi-local.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_PASSWORD: {{ .Values.mysql.rootPassword | quote }}
  MINIO_ROOT_PASSWORD: {{ .Values.minio.rootPassword | quote }}
  JWT_SECRET: {{ .Values.platform.jwtSecret | quote }}
  {{- if and .Values.observability .Values.observability.enabled .Values.observability.otlpHeaders }}
  OTEL_EXPORTER_OTLP_HEADERS: {{ .Values.observability.otlpHeaders | quote }}
  {{- end }}
