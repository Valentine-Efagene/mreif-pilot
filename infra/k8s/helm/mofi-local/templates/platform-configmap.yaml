{{- if .Values.platform.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "mofi-local.labels" . | nindent 4 }}
    app.kubernetes.io/component: platform
data:
  NODE_ENV: development
  AUTH_ENFORCEMENT: local
  DB_HOST: {{ include "mofi-local.mysqlHost" . | quote }}
  DB_PORT: "3306"
  DB_USERNAME: root
  DB_NAME: {{ .Values.mysql.database | quote }}
  REDIS_HOST: {{ include "mofi-local.redisHost" . | quote }}
  REDIS_PORT: "6379"
  CUSTOM_AWS_S3_BUCKET_NAME: {{ .Values.minio.bucket | quote }}
  CUSTOM_AWS_ACCESS_KEY_ID: {{ .Values.minio.rootUser | quote }}
  CUSTOM_AWS_REGION: us-east-1
  CUSTOM_AWS_ENDPOINT: http://{{ include "mofi-local.minioHost" . }}:9000
  CUSTOM_AWS_FORCE_PATH_STYLE: "true"
  PRESIGNED_URL_TTL: "3600"
  NOTIFICATION_URL: {{ .Values.platform.notificationUrl | quote }}
  {{- if and .Values.observability .Values.observability.enabled }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.observability.otlpEndpoint | quote }}
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  {{- end }}
{{- end }}
