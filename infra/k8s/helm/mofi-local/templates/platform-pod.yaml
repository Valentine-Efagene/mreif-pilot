{{- if .Values.platform.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "mofi-local.labels" . | nindent 4 }}
    app.kubernetes.io/component: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: platform
      {{- include "mofi-local.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: platform
        {{- include "mofi-local.selectorLabels" . | nindent 8 }}
    spec:
      initContainers:
        - name: wait-datastores
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              set -e
              until nc -z mysql 3306; do echo waiting mysql; sleep 2; done
              until nc -z redis 6379; do echo waiting redis; sleep 2; done
              until wget -q -O- http://minio:9000/minio/health/live; do echo waiting minio; sleep 2; done
      containers:
        {{- range .Values.platform.roles }}
        - name: {{ .containerName }}
          image: {{ $.Values.platform.image }}
          imagePullPolicy: IfNotPresent
          command: ["./entrypoint.sh"]
          ports:
            {{- if eq .mofiRole "edge" }}
            - containerPort: {{ .port }}
              name: edge-http
            {{- else }}
            - containerPort: {{ .port }}
              name: http
            {{- end }}
          envFrom:
            - configMapRef:
                name: platform-config
          env:
            - name: MOFI_CONTAINER_ROLE
              value: {{ .mofiRole | quote }}
            - name: PORT
              value: {{ .port | quote }}
            - name: MOFI_RUNTIME
              value: {{ .runtime | quote }}
            - name: MOFI_WORKER_QUEUES
              value: {{ .workerQueues | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mofi-secrets
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: mofi-secrets
                  key: JWT_SECRET
            - name: CUSTOM_AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: mofi-secrets
                  key: MINIO_ROOT_PASSWORD
            {{- if and .Values.observability .Values.observability.enabled }}
            {{- if .Values.observability.otlpHeaders }}
            - name: OTEL_EXPORTER_OTLP_HEADERS
              valueFrom:
                secretKeyRef:
                  name: mofi-secrets
                  key: OTEL_EXPORTER_OTLP_HEADERS
            {{- end }}
            {{- end }}
            {{- if eq .mofiRole "edge" }}
            - name: AGENT_UPSTREAM
              value: "http://127.0.0.1:3001"
            - name: PMB_UPSTREAM
              value: "http://127.0.0.1:3002"
            - name: RSA_UPSTREAM
              value: "http://127.0.0.1:3003"
            - name: DEVELOPER_UPSTREAM
              value: "http://127.0.0.1:3004"
            - name: UPLOADER_UPSTREAM
              value: "http://127.0.0.1:3005"
            - name: COOPERATIVE_UPSTREAM
              value: "http://127.0.0.1:3006"
            {{- end }}
          startupProbe:
            httpGet:
              path: {{ .healthPath }}
              port: {{ .port }}
            initialDelaySeconds: {{ if eq .mofiRole "edge" }}45{{ else }}15{{ end }}
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: {{ .healthPath }}
              port: {{ .port }}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: {{ .healthPath }}
              port: {{ .port }}
            initialDelaySeconds: 90
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
        {{- end }}
{{- end }}
