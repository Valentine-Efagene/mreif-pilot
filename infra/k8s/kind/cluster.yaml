# kind cluster for MOFI local dev + test (multicontainer platform Pod).
# NodePort values must match helm/mofi-local/values-*.yaml.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: mofi
nodes:
  - role: control-plane
    extraPortMappings:
      # mofi-dev — platform edge (API)
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
      # mofi-dev — MySQL
      - containerPort: 30307
        hostPort: 3307
        protocol: TCP
      # mofi-dev — Redis
      - containerPort: 30637
        hostPort: 6379
        protocol: TCP
      # mofi-dev — MinIO API / console
      - containerPort: 30900
        hostPort: 9000
        protocol: TCP
      - containerPort: 30901
        hostPort: 9001
        protocol: TCP
      # mofi-dev — RabbitMQ AMQP / management
      - containerPort: 30567
        hostPort: 5672
        protocol: TCP
      - containerPort: 31567
        hostPort: 15672
        protocol: TCP
      # mofi-test — platform edge
      - containerPort: 30081
        hostPort: 8082
        protocol: TCP
      # mofi-test — MySQL
      - containerPort: 30308
        hostPort: 3308
        protocol: TCP
      # mofi-test — Redis
      - containerPort: 30638
        hostPort: 6380
        protocol: TCP
      # mofi-test — MinIO
      - containerPort: 30902
        hostPort: 9100
        protocol: TCP
      - containerPort: 30903
        hostPort: 9101
        protocol: TCP
      # mofi-test — RabbitMQ
      - containerPort: 30568
        hostPort: 5673
        protocol: TCP
      - containerPort: 31568
        hostPort: 15673
        protocol: TCP
